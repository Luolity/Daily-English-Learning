# 服务器配置
server.port=8081
server.servlet.context-path=
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 文件上传目录（绝对路径，避免 Tomcat 临时目录导致保存失败）
app.upload.base-dir=${user.dir}/uploads

# 数据库配置 (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/english_learning?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# MyBatis-Plus配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.english.learning.model
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=tbl_
mybatis-plus.global-config.banner=false
mybatis-plus.type-enums-package=com.english.learning.model

# JWT配置
jwt.secret=englishLearningSecretKey
jwt.expiration=86400000

# 日志配置
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.english.learning=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 允许Bean定义覆盖
spring.main.allow-bean-definition-overriding=true 
