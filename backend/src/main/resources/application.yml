server:
  port: 8081
  servlet:
    context-path: ""

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: "jdbc:mysql://localhost:3306/english_learning?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      continue-on-error: true
  main:
    allow-bean-definition-overriding: true

app:
  upload:
    base-dir: ${user.dir}/uploads

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.english.learning.model
  global-config:
    db-config:
      id-type: auto
      table-prefix: tbl_
  banner: false
  type-enums-package: com.english.learning.model

jwt:
  secret: englishLearningSecretKey
  expiration: 86400000

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.english.learning: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
